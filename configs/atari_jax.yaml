# Backend-specific experiment; algorithms and environments share this file.
version: 2
algo: ppo
runs: 1
resume: false
train:
  total_steps: 1024
  num_envs: 2
  rollout_len: 32
  num_mini_batch: 2
  ppo_epoch: 2
  gae_lambda: 0.95
  device: cpu
model:
  net_arch:
  - 64
  - 64
  lr: 0.0003
evaluation:
  eval_interval: 0
  eval_episodes: 2
  eval_num_envs: 2
  ckpt_count: 1
envs:
- JAXAtari/pong
environment:
  implementation: jaxtari
  frame_skip: 4
  screen_size: 84
  grayscale: true
  noop_max: 30
  terminal_on_life_loss: false
  fire_reset: false
  repeat_action_probability: 0.25
  full_action_space: false
  max_episode_steps: 27000
  wrappers:
    frame_stack: 4
    reward_sign: false
  backend: jax
  autoreset_mode: SameStep
  jax_platform: cpu
family: atari

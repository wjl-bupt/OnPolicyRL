# Backend-specific experiment; algorithms and environments share this file.
version: 2
family: mujoco
algo: ppo
envs:
- MJX/inverted_pendulum
runs: 1
resume: false
train:
  num_envs: 8
  rollout_len: 32
  num_mini_batch: 4
  ppo_epoch: 2
  total_steps: 512
  device: cuda:0
  gae_lambda: 0.95
  log_interval: 1
model:
  net_arch:
  - 64
  - 64
  lr: 0.0003
environment:
  backend: jax
  jax_platform: cpu
  max_episode_steps: 100
  implementation: brax-mjx
  wrappers:
    normalize_observation: true
    observation_clip: 10.0
    normalize_reward: false
    action_mode: rescale
  autoreset_mode: SameStep
evaluation:
  eval_num_envs: 2
  eval_episodes: 2
  eval_interval: 0
  ckpt_count: 1

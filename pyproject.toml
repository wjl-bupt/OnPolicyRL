[project]
name = "oprl"
version = "0.1.0"
description = "Lightweight single-agent on-policy deep RL framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# Core dependencies -- see DESIGN.md §4.8 for the budget rationale.
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "gymnasium[atari,minigrid,mujoco]>=0.29",
    "pyyaml>=6.0.3",
    "minatar>=1.0.15",
    "minigrid>=3.1.0",
    "envpool>=0.8.4",
    "opencv-python-headless>=5.0.0.93",
]

[project.optional-dependencies]
jax = ["jax==0.11.2", "gymnax==1.0.1", "brax==0.14.2", "mujoco-mjx==3.17.0"]
minatar  = ["minatar"]
mujoco   = ["mujoco>=3.1"]
atari    = ["ale-py>=0.10"]
minigrid = ["minigrid>=2.3"]
dmcontrol = ["dm-control==1.0.50"]
playground = ["playground==0.2.0"]
craftax = ["craftax==1.6.1"]
xminigrid = ["xminigrid==0.9.3"]
jaxtari = ["jaxtari==0.2.0"]
box2d = ["gymnasium[box2d]>=1.2"]
track    = ["tensorboard"]
viz      = ["matplotlib>=3.7"]
results  = ["pandas"]

[project.scripts]
oprl = "oprl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oprl", "src/onpolicy", "src/architecture", "src/protocol", "src/memory", "src/common", "src/workflow"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running training tests; skip with -m 'not slow'",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

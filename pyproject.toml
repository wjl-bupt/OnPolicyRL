[project]
name = "oprl"
version = "0.1.0"
description = "Lightweight single-agent on-policy deep RL framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# Core dependencies -- see DESIGN.md §4.8 for the budget rationale.
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "gymnasium[mujoco]>=0.29",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
minatar  = ["minatar"]
mujoco   = ["mujoco>=3.1"]
atari    = ["ale-py>=0.10"]
minigrid = ["minigrid>=2.3"]
track    = ["tensorboard"]
viz      = ["matplotlib>=3.7"]
results  = ["pandas"]

[project.scripts]
oprl = "oprl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oprl"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running training tests; skip with -m 'not slow'",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
